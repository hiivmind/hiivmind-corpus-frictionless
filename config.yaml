# Frictionless Framework Corpus Configuration
schema_version: 2

corpus:
  name: "frictionless"
  display_name: "Frictionless Framework"
  keywords:                    # Routing keywords for per-session discovery
    - "frictionless"
    - "data"
    - "schema"
    - "resource"
    - "package"
    - "validate"
    - "transform"
    - "extract"
    - "datapackage"
    - "descriptor"
  created_at: "2026-01-06T11:00:00Z"

# Multiple sources - each with its own type and tracking
sources:
  - id: "frictionless-py"
    type: "git"
    repo_url: "https://github.com/frictionlessdata/frictionless-py"
    repo_owner: "frictionlessdata"
    repo_name: "frictionless-py"
    branch: "main"
    docs_root: "docs"
    last_commit_sha: "7a043ff00b0a734373162084c57fcc32b957d04c"
    last_indexed_at: "2026-07-01T00:00:00Z"

  - id: "datapackage"
    type: "git"
    repo_url: "https://github.com/frictionlessdata/datapackage"
    repo_owner: "frictionlessdata"
    repo_name: "datapackage"
    branch: "main"
    docs_root: "content/docs"
    last_commit_sha: "6a201af8ed2eacbb3a2440e82e4c55d5807f9c09"
    last_indexed_at: "2026-07-01T00:00:00Z"
    extraction:
      wikilinks: false
      frontmatter: true
      tags: true
      dataview: false

index:
  format: "markdown"
  last_updated_at: "2026-07-01T00:00:00Z"

settings:
  include_patterns:
    - "**/*.md"
    - "**/*.mdx"
  exclude_patterns:
    - "**/_*.md"
    - "**/_snippets/**"
